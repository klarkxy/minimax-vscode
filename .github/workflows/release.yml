name: Release

on:
  push:
    branches: [main]
    # Trigger on tag pushes too, so manual release cuts
    # (`git tag vX.Y.Z && git push origin vX.Y.Z`) flow through the same
    # build + attach pipeline as a release-please cut. Without this, the
    # `package` job below was skipped on manual cuts and every release
    # had to be hand-built + uploaded — which is exactly how the v2.3.0
    # `nul` leak reached the marketplace uncaught.
    tags: ['v*']
  workflow_dispatch:
    # Manual "publish to marketplace" trigger. Use:
    #   gh workflow run release.yml --repo klarkxy/minimax-vscode \
    #     -f ref=v2.4.1
    # `ref` is the tag (or branch) to build + attach + publish. Defaults
    # to the latest semver tag if empty.
    inputs:
      ref:
        description: 'Tag or branch to publish (e.g. v2.4.1). Leave empty for the latest semver tag.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Only the release-please job needs to run on main pushes. On tag
    # pushes release-please is a no-op (no new commits since the last
    # release); the `package` job below still runs off the tag's own
    # push event.
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    env:
      # Opt all third-party GitHub Actions in this workflow into Node.js 24
      # before GitHub forces the changeover on 2026-06-16.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          # Temporary: skip PR creation (GitHub Actions PR permission not enabled
          # at the repo level). release-please will push the release commit and
          # tag directly to main instead. Revert once the repo setting is fixed.
          skip-github-pull-request: true

  package:
    # Build the VSIX, render release notes from CHANGELOG.md, and attach
    # the artifact to the GitHub Release. Does NOT call `vsce publish` —
    # marketplace publishing is intentionally manual now (see RELEASING.md):
    # the project has never had a long-lived VSCE_PAT, and automating
    # something that lives or dies on a PAT is a footgun. Local publish
    # is one `npx vsce publish --packagePath dist/*.vsix` away.
    #
    # This job intentionally does NOT `needs: release` — on a manual tag
    # push the `release` job is skipped (its `if: github.ref_type == 'branch'`
    # is false on a tag), but we still want the VSIX built and attached.
    # The `if:` below fires on either a release-please cut (auto, on main)
    # or any `v*` tag push (manual).
    if: |
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.ref == 'refs/heads/main' && needs.release.outputs.release_created == 'true'))
    runs-on: ubuntu-latest
    env:
      # Opt all third-party GitHub Actions in this workflow into Node.js 24
      # before GitHub forces the changeover on 2026-06-16.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    environment: production
    concurrency:
      group: package-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: rm -rf dist && mkdir -p dist && npm run package

      - name: Locate VSIX
        id: vsix
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one VSIX in dist, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Render release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          # Extract the section between "## <version> " and the next "## "
          # header. This way the GitHub Release body always matches the
          # CHANGELOG.md text byte-for-byte, regardless of whether the
          # release was cut by release-please or by hand.
          tag="${GITHUB_REF_NAME}"   # e.g. v2.4.1
          version="${tag#v}"          # e.g. 2.4.1
          awk -v ver="$version" '
            BEGIN { in_section = 0 }
            /^## [0-9]/ {
              if (in_section) { exit }
              if ($0 ~ "^## " ver "( |$|-)") { in_section = 1; print; next }
              next
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for ${version}; falling back to auto-generated notes."
            rm -f release-notes.md
            exit 0
          fi
          echo "Rendered release notes for ${version}:"
          head -5 release-notes.md
          echo "  ..."
          wc -l release-notes.md

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: ${{ steps.vsix.outputs.path }}
          fail_on_unmatched_files: true
          # If the release already exists (e.g. a hand-cut release that
          # this workflow is now re-running against, or the auto-cut
          # double-fire), update it in place instead of erroring out.
          overwrite: true

      - name: Show release info
        run: |
          echo "Packaged ${{ github.ref_name }} — VSIX at ${{ steps.vsix.outputs.path }}"

  publish-marketplace:
    # Marketplace publish is a separate, opt-in job. Two ways to fire it:
    #
    #   1. Manual: Actions tab → Release workflow → "Run workflow" →
    #      set the `ref` input to a tag like v2.4.1 (or leave empty for
    #      the latest semver tag).
    #   2. `gh workflow run release.yml --repo klarkxy/minimax-vscode \
    #          -f ref=v2.4.1`
    #
    # The job is intentionally NOT triggered by tag pushes — publishing
    # to the marketplace is irreversible (the version goes live to all
    # VS Code users within ~10 min), so we require a deliberate click
    # instead of firing it on every `git push --tags`.
    #
    # Required secret: VSCE_PAT. Missing-secret is a hard fail, not a
    # silent skip — the run is the only way to find out the secret has
    # expired, and a silent skip is how a stale PAT ships a broken
    # release.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    environment: production
    concurrency:
      group: publish-marketplace
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Resolve target ref
        id: ref
        shell: bash
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            REF="${{ inputs.ref }}"
          else
            # Latest semver tag, descending.
            REF=$(git ls-remote --tags --sort=-v:refname origin | \
                  head -1 | awk '{print $2}' | sed 's#refs/tags/##')
            if [ -z "$REF" ]; then
              echo "::error::No tags found on origin; pass -f ref=vX.Y.Z explicitly."
              exit 1
            fi
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved ref: $REF"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: rm -rf dist && mkdir -p dist && npm run package

      - name: Locate VSIX
        id: vsix
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one VSIX in dist, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace
        # `languageModelThinkingPart` is a proposed API and must be
        # whitelisted per-publish — vsce refuses to ship an extension
        # that uses unallowed proposed APIs. We declare it in
        # package.json#enabledApiProposals; mirror that list here.
        run: |
          npm exec -- vsce publish \
            --packagePath "${{ steps.vsix.outputs.path }}" \
            --allow-proposed-apis languageModelThinkingPart
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
