name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          # Temporary: skip PR creation (GitHub Actions PR permission not enabled
          # at the repo level). release-please will push the release commit and
          # tag directly to main instead. Revert once the repo setting is fixed.
          skip-github-pull-request: true

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: publish-${{ needs.release.outputs.tag_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: rm -rf dist && mkdir -p dist && npm run package

      - name: Locate VSIX
        id: vsix
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one VSIX in dist, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace
        # Marketplace 暂不自动发布；需手动开启 PUBLISH_VSCODE_MARKETPLACE=true + 配置 VSCE_PAT
        if: ${{ vars.PUBLISH_VSCODE_MARKETPLACE == 'true' && secrets.VSCE_PAT != '' }}
        run: npm exec -- vsce publish --packagePath "${{ steps.vsix.outputs.path }}" --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        # Open VSX 暂不自动发布；需手动开启 PUBLISH_OPEN_VSX=true + 配置 OVSX_PAT
        if: ${{ vars.PUBLISH_OPEN_VSX == 'true' && secrets.OVSX_PAT != '' }}
        run: npm exec -- ovsx publish --skip-duplicate "${{ steps.vsix.outputs.path }}"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: ${{ steps.vsix.outputs.path }}
          fail_on_unmatched_files: true

      - name: Show release info
        run: |
          echo "Released ${{ needs.release.outputs.tag_name }}"
